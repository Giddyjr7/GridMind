<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070c0a" />
    <title>Offline | GridMind</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #070c0a; color: #e2e8f0; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 1.05rem; font-weight: 600; margin: 20px 0 8px; }
      p { font-size: 0.8rem; line-height: 1.6; color: #94a3b8; margin: 0 0 20px; }
      strong { color: #fca5a5; font-weight: 600; }
      button {
        font: inherit; font-size: 0.8rem; color: #e2e8f0; cursor: pointer;
        background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px; padding: 9px 18px;
      }
      button:hover { background: rgba(255, 255, 255, 0.08); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>GridMind is offline</h1>
      <p>
        This device cannot reach the GridMind API, so no telemetry, outage-risk forecast or
        recommendation shown here would be current. <strong>Treat the site as unmonitored</strong>
        until the connection returns.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
